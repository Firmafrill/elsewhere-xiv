<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elsewhere XIV - Guide</title>
  <meta name="description" content="FFXIV modding guide" />
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Oxygen:wght@300;400;700&family=Overpass+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/guide.css">

</head>
<body class="guide-page">
  <header class="site-header">
    <div class="wrap">
      <div class="hero" role="banner">
        <div class="brand">
          <img class="brand-avatar" src="../assets/images/icons/site-icon.png" alt="Site icon" />
          <div>
            <h1>Elsewhere XIV</h1>
            <small>FFXIV modding guides and resources</small>
          </div>
        </div>
        <nav aria-label="Primary">
          <a href="../index.html">Home</a>
          <a href="#">About</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="guide-layout">
      <aside class="guide-sidebar">
  <div class="guide-sidebar-inner">

    <section class="guide-docs-box">
      <h3 class="guide-sidebar-subtitle">Documents</h3>
      <ul class="guide-tabs" id="guideTabs">
        <li class="guide-tab active">Main document</li>
      </ul>

      <div class="guide-doc-buttons" id="guideDocButtons">
      </div>
    </section>


    <section class="guide-outline-box">
      <h2 class="guide-sidebar-title">Outline</h2>
      <p class="guide-sidebar-empty" id="guideTocEmpty">
        Sections will appear once the guide is loaded.
      </p>
      <nav aria-label="Guide Outline">
        <ul class="guide-toc" id="guideToc"></ul>
      </nav>
    </section>

  </div>
</aside>


      <article class="guide-main" aria-label="Guide content">
        <header class="guide-header">
          <p class="guide-breadcrumb">
            <a href="../index.html">← Back to archive</a>
          </p>
          <h1 id="guideTitle" class="guide-title">Loading guide…</h1>
          <p id="guideMeta" class="guide-meta"></p>
        </header>

        <section
          id="guideContent"
          class="guide-content"
          aria-label="Guide body"
        >
          <p class="guide-loading">Loading guide details…</p>
        </section>
      </article>
    </div>
  </main>


  <script src="../js/layout.js"></script>
<script src="../js/marked.umd.js"></script>
<script src="../js/guide.js"></script>
</body>
</html>
